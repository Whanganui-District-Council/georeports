#######################
# db_config.properties
#######################

#### JDBC Connections ####

# Example GIS Database (PostgreSQL)
jdbc.gis.url=jdbc:postgresql://gis-server:5432/gis
jdbc.gis.user=gis_user
jdbc.gis.pass=gis_pass
jdbc.gis.pool=20
jdbc.gis.driver=org.postgresql.Driver

# Example Asset Management (PostgreSQL on different server)
jdbc.assets.url=jdbc:postgresql://assets-server:5432/assets
jdbc.assets.user=assets_user
jdbc.assets.pass=assets_pass
jdbc.assets.pool=20
jdbc.assets.driver=org.postgresql.Driver

# Example ERP System (MSSQL)
jdbc.erp.url=jdbc:sqlserver://erp-server:1433;databaseName=erp;encrypt=true;trustServerCertificate=true
jdbc.erp.user=erp_user
jdbc.erp.pass=erp_pass
jdbc.erp.pool=20
jdbc.erp.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver


#### OGR Connections ####

# Example OGR Connections (PostgreSQL)
ogr.gis.ogr=PG:host=gis-server port=5432 dbname=gis user=gis_user password=gis_pass
ogr.assets.ogr=PG:host=assets-server port=5432 dbname=assets user=assets_user password=assets_pass

# Example OGR Connections (MSSQLSpatial)
ogr.erp.ogr=MSSQL:driver={ODBC Driver 17 for SQL Server};server=erp-server;database=erp;uid=erp_user;pwd=erp_pass

